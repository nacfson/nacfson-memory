services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: mem1
      POSTGRES_PASSWORD: mem1
      POSTGRES_DB: mem1
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    volumes:
      - mem1_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem1 -d mem1"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  mem1_pgdata:
